[package]
name = "gardenwall-fetch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Untrusted, sandboxed model download helper (ADR-013 §2.6): fetches a file's bytes from Hugging Face through the trusted core's connection gate; the core verifies them."
publish = false

[[bin]]
name = "gardenwall-fetch"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
gardenwall-models = { path = "../gardenwall-models" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
