[package]
name = "gardenwall-models"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Gardenwall model intake: GGUF validation, integrity verification, chat-template audit, local import, and optional hub downloads (ADR-013)."
publish = false

[features]
default = ["hub"]
# Model hub client (network). Build with `--no-default-features` for a
# Gardenwall that contains no HTTP/TLS code at all (ADR-013 §2.7).
hub = ["dep:futures-util", "dep:reqwest", "dep:tokio", "dep:url"]

[dependencies]
futures-util = { version = "0.3.34", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["fs", "io-util", "rt", "macros", "time"], optional = true }
url = { version = "2.5.8", optional = true }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"]

[dev-dependencies]
gardenwall-fuzzkit = { path = "../gardenwall-fuzzkit" }
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros"] }

[[example]]
name = "fetch"
required-features = ["hub"]
