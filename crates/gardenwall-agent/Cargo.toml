[package]
name = "gardenwall-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pi-faithful agent harness for Gardenwall (ADR-014)"
publish = false

[dependencies]
gardenwall-policy = { path = "../gardenwall-policy" }
gardenwall-fs = { path = "../gardenwall-fs" }
gardenwall-inference = { path = "../gardenwall-inference" }
gardenwall-sandbox = { path = "../gardenwall-sandbox" }
# The secret scanner only (no network client): commit and flow checks.
gardenwall-egress = { path = "../gardenwall-egress", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
regex = "1.13.1"
ignore = "0.4.34"
globset = "0.4.21"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
