[package]
name = "gardenwall-sandbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Gardenwall cross-platform process sandbox (ADR-012). Windows: AppContainer + Job Objects."
publish = false

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Isolation",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
]

[target.'cfg(windows)'.dependencies]
getrandom = "0.4.3"
tokio = { version = "1.54.1", features = ["net"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "macros", "io-util", "time"] }
tempfile = "3.27.0"
