[package]
name = "gardenwall-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pinned, hash-verified llama.cpp runtime installation and per-launch verification (ADR-013 §2.5)."
publish = false

[dependencies]
flate2 = "1.1.11"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["fs", "io-util", "rt", "macros", "time"] }
url = "2.5.8"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
