[package]
name = "gardenwall-egress"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Gardenwall egress gateway: SSRF guard, DNS-pinned fetching, redirect policy and outbound secret scanning (ADR-007 §10, ADR-012 §5)"
publish = false

[features]
default = ["fetch"]
# The network client. Without it the crate is the address rules, URL
# validation and secret scanner only (used by the agent's red-team tests).
fetch = ["dep:futures-util", "dep:reqwest", "dep:tokio"]

[dependencies]
futures-util = { version = "0.3.34", optional = true }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"], optional = true }
tokio = { version = "1.54.1", features = ["net", "time"], optional = true }
url = "2.5.8"

[dev-dependencies]
gardenwall-fuzzkit = { path = "../gardenwall-fuzzkit" }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "time"] }
