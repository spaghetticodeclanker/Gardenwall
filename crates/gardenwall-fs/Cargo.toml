[package]
name = "gardenwall-fs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Workspace grants, checkpoints and diffs for the Gardenwall agent (ADR-011)"
publish = false

[dependencies]
gardenwall-policy = { path = "../gardenwall-policy" }
cap-std = "4.0.3"
similar = "3.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.27.0"
