[package]
name = "gardenwall-inference"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Gardenwall inference runtime supervision (llama-server sidecar) and streaming chat client."
publish = false

[dependencies]
bytes = "1.12.1"
getrandom = "0.4.3"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "io-util", "time", "sync", "macros", "rt", "net", "fs"] }

[target.'cfg(windows)'.dependencies]
gardenwall-sandbox = { path = "../gardenwall-sandbox" }

[dev-dependencies]
gardenwall-fuzzkit = { path = "../gardenwall-fuzzkit" }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros"] }
