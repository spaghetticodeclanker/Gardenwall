[package]
name = "gardenwall-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Minimal MCP client (stdio transport: tools, resources and prompts) for Gardenwall. Servers are untrusted; they run in the OS sandbox and everything they send is bounded and validated."
publish = false

[dependencies]
serde_json = "1.0.154"

[dev-dependencies]
gardenwall-fuzzkit = { path = "../gardenwall-fuzzkit" }
