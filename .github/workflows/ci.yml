# Gardenwall CI — runs on every supported desktop platform.
# Third-party actions are pinned to full commit SHAs (tag noted alongside).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.13.0" # the release builds' Node.js (npm 11); npm 12 rejects the lock file
      - name: Build UI (type-check + bundle; embedded by the app crate)
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev
          npm run build
      - name: Format
        run: cargo fmt --all --check
      - name: Licence notices are up to date
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/licence-notices.py --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Sandbox diagnostics (prints only; temporary)
        if: runner.os == 'Windows'
        run: cargo test -p gardenwall-agent --test sandbox_shell --locked runner_diagnostics -- --ignored --nocapture
      - name: Test
        run: cargo test --workspace --locked
      - name: No-hub build contains no network code (ADR-013 §2.7)
        shell: bash
        run: |
          cargo clippy -p gardenwall-models --no-default-features --lib --tests --locked -- -D warnings
          cargo test -p gardenwall-models --no-default-features --locked
          if cargo tree -p gardenwall-models --no-default-features -e normal --locked | grep -E 'reqwest|hyper|rustls|aws-lc|tokio'; then
            echo "network crates found in the no-hub build" >&2
            exit 1
          fi

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  sbom:
    # Software bill of materials (Phase 6): CycloneDX for every Rust crate
    # and for the UI's production npm packages, kept as a build artifact.
    name: SBOM (CycloneDX)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain and cargo-cyclonedx
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          cargo install cargo-cyclonedx --version 0.5.10 --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.13.0" # the release builds' Node.js (npm 11); npm 12 rejects the lock file
      - name: Generate
        shell: bash
        run: |
          cargo cyclonedx --format json --all-features
          mkdir -p sbom
          find crates -name '*.cdx.json' -exec mv {} sbom/ \;
          (cd ui && npm ci --no-audit --no-fund && npm sbom --sbom-format cyclonedx --omit dev) > sbom/gardenwall-ui.cdx.json
          ls -l sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom
          retention-days: 90
